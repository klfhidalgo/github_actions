name: Deployment
on:
  push:
    branches:
      - develop
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Dependencies
        uses: ./.github/actions/caching # aqui automaticamente busca el archivo action.yml
      - name: Lint code
        run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Dependencies
        id: caching
        uses: ./.github/actions/composite_action # aqui automaticamente busca el archivo action.yml
        with:
          caching: 'false'
      - name: Output caching
        run: echo "Cahing used --> ${{ steps.caching.outputs.caching }}"
      - name: Test code
        id: run-tests
        run: npm run test
      - name: Upload test report
        if: failure() && steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test.json
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Dependencies
        uses: ./.github/actions/caching # aqui automaticamente busca el archivo action.yml
      - name: Build website
        run: npm run build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Get build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: ./dist
      - name: Output contents
        run: ls
      - name: Deploy site
        run: echo "Deploying..."
  javascript_action:
    runs-on: ubuntu-latest
    steps:
      - name: Javascript Action
        id: js_action
        uses: ./.github/actions/javascript_action # aqui automaticamente busca el archivo action.yml